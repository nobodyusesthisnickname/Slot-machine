<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REEL LAB · 3릴 시뮬레이터</title><meta name="description" content="레버로 작동하는 가상 칩 3릴 시뮬레이터"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23130f0a'/%3E%3Ctext x='8' y='25' font-size='26' fill='%23e6bc64'%3E7%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body><main><div class="toolbar"><button id="settings-button" aria-expanded="false" aria-controls="settings-panel">⚙ 설정</button><button id="reset">↻ 릴 리셋</button><div id="settings-panel" class="settings-panel" hidden><h2>화면 설정</h2><label>확률 정보 <span><input id="probability-toggle" type="checkbox" role="switch" checked><span id="probability-state">ON</span></span></label><label>칩 사용 정보 <span><input id="chips-toggle" type="checkbox" role="switch" checked><span id="chips-state">ON</span></span></label><button id="admin-button" class="admin-link" type="button">관리자</button></div></div><div class="layout"><aside><section class="panel" id="probability-panel"><h2>확률 정보</h2><dl><div><dt data-mult-label="3">1.5배</dt><dd data-prob="3">20%</dd></div><div><dt data-mult-label="2">2배</dt><dd data-prob="2">10%</dd></div><div><dt data-mult-label="4">3배</dt><dd data-prob="4">3%</dd></div><div><dt data-mult-label="1">5배</dt><dd data-prob="1">1%</dd></div><div><dt data-mult-label="0">10배</dt><dd data-prob="0">0.5%</dd></div><div><dt>미당첨</dt><dd id="lose-prob">65.5%</dd></div></dl><p id="rtp-text">RTP 69% · 당첨 확률 34.5%</p></section><section class="panel" id="payout-panel"><h2>배당</h2><dl class="payout"><div><dt aria-label="망고 3개"><span class="sprite s3" aria-hidden="true"></span><span class="sprite s3" aria-hidden="true"></span><span class="sprite s3" aria-hidden="true"></span></dt><dd data-pay="3">×1.5</dd></div><div><dt aria-label="체리 3개"><span class="sprite s2" aria-hidden="true"></span><span class="sprite s2" aria-hidden="true"></span><span class="sprite s2" aria-hidden="true"></span></dt><dd data-pay="2">×2</dd></div><div><dt aria-label="종 3개"><span class="sprite s4" aria-hidden="true"></span><span class="sprite s4" aria-hidden="true"></span><span class="sprite s4" aria-hidden="true"></span></dt><dd data-pay="4">×3</dd></div><div><dt aria-label="BAR 3개"><span class="sprite s1" aria-hidden="true"></span><span class="sprite s1" aria-hidden="true"></span><span class="sprite s1" aria-hidden="true"></span></dt><dd data-pay="1">×5</dd></div><div><dt aria-label="7 3개"><span class="sprite s0" aria-hidden="true"></span><span class="sprite s0" aria-hidden="true"></span><span class="sprite s0" aria-hidden="true"></span></dt><dd data-pay="0">×10</dd></div></dl><p>사용 칩 기준 총 지급 배수</p></section></aside><div class="machine-wrap"><section class="machine"><div class="reels" aria-label="릴 결과"><div class="reel"><span class="symbol seven" id="r0">7</span></div><div class="reel"><span class="symbol seven" id="r1">7</span></div><div class="reel"><span class="symbol seven" id="r2">7</span></div></div></section><button id="spin" class="lever" aria-label="레버 당겨 릴 돌리기" title="클릭하거나 아래로 당겨 시작"><span class="mount"></span><span class="shaft"><span class="knob"></span></span></button></div></div><section id="chip-panel" class="dashboard" aria-label="가상 칩 및 세션"><div><span class="label">보유 칩</span><div class="stepper"><button id="chip-minus" aria-label="보유 칩 1,000 줄이기">−</button><b id="balance"></b><button id="chip-plus" aria-label="보유 칩 1,000 늘리기">＋</button></div></div><div><span class="label">사용 칩</span><div class="stepper"><button id="minus" aria-label="사용 칩 줄이기">−</button><b id="bet"></b><button id="plus" aria-label="사용 칩 늘리기">＋</button></div></div><div><span class="label">최근 지급</span><b id="last"></b></div><div><span class="label">진행 / 당첨</span><b><span id="count">0</span> / <span id="wins">0</span></b></div><div><span class="label">누적 이익</span><b id="net"></b></div></section><div id="message" class="sr-only" role="status" aria-live="polite"></div></main><div id="modal-overlay" class="modal-overlay" hidden><form id="admin-login" class="modal" role="dialog" aria-modal="true" aria-labelledby="admin-login-title" autocomplete="off" hidden><h2 id="admin-login-title">관리자 확인</h2><label class="field">비밀번호<input id="admin-password" type="password" autocomplete="off" required></label><p id="admin-login-error" class="form-error" role="alert"></p><div class="modal-actions"><button type="button" id="admin-login-cancel">취소</button><button type="submit" class="primary">확인</button></div></form><div id="admin-panel" class="modal wide" role="dialog" aria-modal="true" aria-labelledby="admin-title" hidden><h2 id="admin-title">관리 · 배당과 확률</h2><table class="admin-table"><thead><tr><th>심벌</th><th>배당(배)</th><th>확률(%)</th></tr></thead><tbody id="admin-rows"></tbody><tfoot><tr><td>미당첨</td><td>-</td><td id="admin-lose">65.5</td></tr></tfoot></table><p id="admin-summary" class="admin-summary"></p><p id="admin-error" class="form-error" role="alert"></p><p id="admin-status" class="form-ok" role="status"></p><div class="modal-actions"><button type="button" id="admin-close">닫기</button><button type="button" id="admin-apply" class="primary">적용</button></div></div></div><script src="app.js"></script></body></html>
